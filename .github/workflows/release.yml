name: Release desktop app

# Publishes a release when a version tag (v0.2.0) is pushed. The tag must match package.json.
# A manual run only builds the installers (dry run).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            script: dist:mac
            files: dist/Lunaread-arm64.dmg
          - os: windows-latest
            script: dist:win
            files: dist/Lunaread-Setup-x64.exe
          - os: ubuntu-latest
            script: dist:linux
            files: dist/Lunaread-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json $VERSION"; exit 1; fi
          gh release create "v$VERSION" artifacts/* --title "Lunaread v$VERSION" --generate-notes --latest
